<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyloom — AI 互动小说</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-main: #c5c6c7;
            --text-highlight: #66fcf1;
            --accent-color: #45a29e;
            --system-color: #f39c12;
            --danger-color: #e74c3c;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1f2833 0%, #0b0c10 70%);
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            background: rgba(31, 40, 51, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 252, 241, 0.15);
            border-radius: var(--border-radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* ── Dashboard ─────────────────────────── */
        .dashboard {
            padding: 20px 30px;
            background: rgba(11, 12, 16, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 300px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-label {
            width: 70px;
            color: var(--text-main);
        }

        .stat-bar-bg {
            flex: 1;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-right: 15px;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-value {
            width: 55px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .inventory-area {
            flex: 1.5;
            padding-left: 30px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .inventory-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .inventory-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .inv-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ddd;
        }

        .tag-section { margin-bottom: 12px; }
        .tag-section-label { font-size: 0.75rem; color: #666; margin-bottom: 4px; }

        /* ── Narrative area ────────────────────── */
        .narrative-area {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            line-height: 2;
            font-size: 1.1rem;
            scroll-behavior: smooth;
        }

        .narrative-area::-webkit-scrollbar { width: 6px; }
        .narrative-area::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

        .story-char { animation: fadeIn 0.05s ease-in forwards; opacity: 0; }

        .player-action {
            color: var(--text-highlight);
            margin: 25px 0;
            font-weight: 500;
            padding: 10px 15px;
            background: rgba(102, 252, 241, 0.05);
            border-left: 3px solid var(--text-highlight);
            border-radius: 0 8px 8px 0;
        }

        .system-message {
            color: var(--system-color);
            margin: 15px 0;
            font-size: 0.95rem;
            text-align: center;
            font-style: italic;
        }

        /* ── Control area ──────────────────────── */
        .control-area {
            padding: 25px 30px;
            background: rgba(11, 12, 16, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 80px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: rgba(69, 162, 158, 0.1);
            color: var(--text-highlight);
            border: 1px solid var(--accent-color);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .choice-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
        }

        .choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .start-btn {
            background: rgba(102, 252, 241, 0.15);
            color: var(--text-highlight);
            border: 2px solid var(--text-highlight);
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: var(--text-highlight);
            color: #000;
        }

        .loading-text {
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(69, 162, 158, 0.3);
            border-top-color: var(--text-highlight);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ── Animations ────────────────────────── */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes flashHighlight {
            0% { background-color: rgba(102, 252, 241, 0.8); color: #000; box-shadow: 0 0 15px var(--text-highlight); }
            100% { background-color: transparent; color: inherit; box-shadow: none; }
        }
        @keyframes flashDanger {
            0% { background-color: rgba(231, 76, 60, 0.8); box-shadow: 0 0 15px var(--danger-color); }
            100% { background-color: transparent; box-shadow: none; }
        }

        .flash-update { animation: flashHighlight 1s ease-out; }
        .flash-danger  { animation: flashDanger 1s ease-out; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="dashboard" id="dashboard">
        <div class="stats-area" id="stats-area"></div>
        <div class="inventory-area">
            <div class="inventory-title">持有物品</div>
            <div class="inventory-tags" id="inventory-list"></div>
        </div>
    </div>

    <div class="narrative-area" id="narrative-area">
        <p style="color:#888; text-align:center; margin-top:120px;">
            点击下方按钮开始你的故事
        </p>
    </div>

    <div class="control-area" id="control-area">
        <button class="start-btn" id="start-btn" onclick="startGame()">开始游戏</button>
        <div class="loading-text" id="loading-text" style="display:none">
            <div class="spinner"></div> 命运正在交织...
        </div>
    </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
let sessionId = null;
let eventSource = null;
let currentChoices = null;
let lastStateVars = {};
let tokenContainer = null;  // real-time progress indicator element
let tokenCharCount = 0;     // characters received this round
let segmentQueue = [];      // segments waiting to be displayed
let segmentTimer = null;    // timer for paced segment display

// ── API helpers ────────────────────────────────────────────────────
const API = '';

async function apiPost(path, body = {}) {
    const res = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || 'Request failed');
    }
    return res.json();
}

// ── SSE connection ─────────────────────────────────────────────────
function connectSSE() {
    if (eventSource) eventSource.close();

    eventSource = new EventSource(API + `/api/game/${sessionId}/stream`);

    eventSource.addEventListener('token', (e) => {
        const data = JSON.parse(e.data);
        tokenCharCount += data.text.length;
        // First token of a new round — clear loading, show progress
        if (!tokenContainer) {
            showLoading(false);
            const placeholder = document.getElementById('narrative-area').querySelector('.placeholder');
            if (placeholder) placeholder.remove();
            tokenContainer = document.createElement('div');
            tokenContainer.className = 'system-message';
            tokenContainer.style.marginBottom = '20px';
            tokenContainer.innerHTML = '正在生成... <span class="progress">已接收 ' + tokenCharCount + ' 字</span>';
            document.getElementById('narrative-area').appendChild(tokenContainer);
        } else {
            // Update live character count
            const progressEl = tokenContainer.querySelector('.progress');
            if (progressEl) progressEl.textContent = '已接收 ' + tokenCharCount + ' 字';
        }
        scrollToBottom();
    });

    eventSource.addEventListener('segment', (e) => {
        const data = JSON.parse(e.data);
        segmentQueue.push(data.text);
        // Start paced display if not already running
        if (!segmentTimer) {
            // First segment — clear progress indicator
            if (tokenContainer) {
                tokenContainer.remove();
                tokenContainer = null;
                tokenCharCount = 0;
            }
            drainSegmentQueue();
        }
    });

    eventSource.addEventListener('choices', (e) => {
        const data = JSON.parse(e.data);
        renderChoices(data.options);
    });

    eventSource.addEventListener('state', (e) => {
        const data = JSON.parse(e.data);
        updateDashboard(data.vars);
    });

    eventSource.addEventListener('wait', (e) => {
        showLoading(true);
    });

    eventSource.addEventListener('error', (e) => {
        try {
            const data = JSON.parse(e.data);
            appendSystem('⚠ ' + data.message);
        } catch (_) {
            appendSystem('⚠ 连接异常');
        }
        showLoading(false);
    });

    eventSource.addEventListener('done', (e) => {
        showLoading(false);
        // If no choices rendered, the story continues automatically
        if (!currentChoices) {
            showLoading(true);
        }
    });

    eventSource.addEventListener('heartbeat', () => {
        // keepalive — nothing to do
    });

    eventSource.onerror = () => {
        // EventSource will auto-reconnect
    };
}

// ── Game actions ───────────────────────────────────────────────────
async function startGame() {
    const startBtn = document.getElementById('start-btn');
    startBtn.style.display = 'none';
    clearNarrative();
    showLoading(true);

    try {
        const data = await apiPost('/api/game/new');
        sessionId = data.session_id;
        connectSSE();
    } catch (err) {
        appendSystem('⚠ ' + err.message);
        showLoading(false);
        startBtn.style.display = 'block';
    }
}

async function submitChoice(index) {
    // Capture choice before clearing
    const choice = currentChoices ? currentChoices.find(c => c.index === index) : null;
    hideChoices();  // clears currentChoices, tokenContainer, shows loading

    // Show what the player chose
    if (choice) {
        const actionDiv = document.createElement('div');
        actionDiv.className = 'player-action';
        actionDiv.innerText = `> ${choice.label}`;
        document.getElementById('narrative-area').appendChild(actionDiv);
        scrollToBottom();
    }

    try {
        await apiPost(`/api/game/${sessionId}/choice`, { choice_key: String(index) });
        // SSE stream will deliver the next round automatically
    } catch (err) {
        appendSystem('⚠ ' + err.message);
        showLoading(false);
    }
}

// ── UI updates ─────────────────────────────────────────────────────
function appendSegment(text) {
    // Called by drainSegmentQueue for paced rendering.
    // Also used for choice-action labels and other single-line inserts.
    showLoading(false);
    const area = document.getElementById('narrative-area');

    const placeholder = area.querySelector('.placeholder');
    if (placeholder) placeholder.remove();

    const container = document.createElement('div');
    container.style.marginBottom = '20px';
    container.style.animation = 'fadeIn 0.3s ease-in';
    container.textContent = text;
    area.appendChild(container);
    scrollToBottom();
}

function drainSegmentQueue() {
    // Pop one segment and display it. Keep going with a delay.
    if (segmentQueue.length === 0) {
        clearInterval(segmentTimer);
        segmentTimer = null;
        return;
    }
    const text = segmentQueue.shift();
    appendSegment(text);

    // If queue still has content, schedule next pop
    if (segmentQueue.length > 0 && !segmentTimer) {
        segmentTimer = setInterval(() => {
            if (segmentQueue.length === 0) {
                clearInterval(segmentTimer);
                segmentTimer = null;
                return;
            }
            appendSegment(segmentQueue.shift());
        }, 350);  // ~350ms between segments — comfortable reading pace
    }
}

function appendSystem(msg) {
    const area = document.getElementById('narrative-area');
    const div = document.createElement('div');
    div.className = 'system-message';
    div.innerText = msg;
    area.appendChild(div);
    scrollToBottom();
}

function clearNarrative() {
    const area = document.getElementById('narrative-area');
    area.innerHTML = '';
    tokenContainer = null;
    tokenCharCount = 0;
    segmentQueue = [];
    if (segmentTimer) { clearInterval(segmentTimer); segmentTimer = null; }
}

function renderChoices(options) {
    currentChoices = options;
    hideChoices();

    const ctrl = document.getElementById('control-area');
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = `[${opt.index}] ${opt.label}`;
        btn.onclick = () => submitChoice(opt.index);
        btn.id = 'choice-' + opt.index;
        ctrl.appendChild(btn);
    });
}

function hideChoices() {
    document.querySelectorAll('.choice-btn').forEach(b => b.remove());
    currentChoices = null;
    tokenContainer = null;   // reset for next round
    tokenCharCount = 0;
    segmentQueue = [];        // clear any pending segments
    if (segmentTimer) { clearInterval(segmentTimer); segmentTimer = null; }
    // Switch to loading spinner until tokens arrive
    showLoading(true);
}

function showLoading(show) {
    const el = document.getElementById('loading-text');
    el.style.display = show ? 'flex' : 'none';
}

function scrollToBottom() {
    const area = document.getElementById('narrative-area');
    area.scrollTop = area.scrollHeight;
}

// ── Dashboard ──────────────────────────────────────────────────────
function updateDashboard(stateVars) {
    const statsArea = document.getElementById('stats-area');
    const invList = document.getElementById('inventory-list');

    statsArea.innerHTML = '';
    invList.innerHTML = '';

    // Use the first 3 numeric variables as stat bars
    // String vars become tags, list vars go to inventory
    const barColors = ['#45a29e', '#9b59b6', '#e67e22', '#3498db', '#e74c3c'];
    let colorIdx = 0;
    let barCount = 0;

    for (const [name, value] of Object.entries(stateVars || {})) {
        if (typeof value === 'number' && barCount < 5) {
            // Render as a stat bar
            const pct = Math.min(100, Math.max(0, value));
            const row = document.createElement('div');
            row.className = 'stat-row';
            row.id = `stat-${name}`;

            const color = barColors[colorIdx % barColors.length];
            colorIdx++;

            // Flash animation if value dropped
            const prev = lastStateVars[name];
            if (typeof prev === 'number' && prev > value) {
                row.classList.add('flash-danger');
                setTimeout(() => row.classList.remove('flash-danger'), 1000);
            }

            row.innerHTML = `
                <div class="stat-label">${name}</div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill" style="width:${pct}%;background:${color}"></div>
                </div>
                <div class="stat-value">${value}</div>
            `;
            statsArea.appendChild(row);
            barCount++;

        } else if (typeof value === 'string') {
            // Render as a tag
            const tag = document.createElement('div');
            tag.className = 'inv-tag';
            tag.textContent = `${name}: ${value}`;
            tag.style.display = 'inline-block';
            tag.style.marginRight = '8px';
            tag.style.marginBottom = '4px';
            invList.appendChild(tag);

        } else if (Array.isArray(value) && value.length > 0) {
            // List items
            value.forEach(item => {
                const tag = document.createElement('div');
                tag.className = 'inv-tag';
                tag.textContent = String(item);
                const prevList = lastStateVars[name] || [];
                if (!prevList.includes(item)) {
                    tag.classList.add('flash-update');
                }
                invList.appendChild(tag);
            });
        }
    }

    lastStateVars = { ...stateVars };
}
</script>
</body>
</html>
