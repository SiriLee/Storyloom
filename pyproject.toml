[build-system]
requires = ["setuptools>=64", "babel>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "storyloom-engine"
version = "2.3.3"
description = "AI-powered real-time visual novel engine"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
bg = ["onnxruntime>=1.18", "numpy>=1.24"]
desktop = ["pywebview>=5.0"]
test = ["babel>=2.10", "pytest>=7.0"]

[project.scripts]
storyloom-web = "storyloom.web.server:main"

[tool.setuptools.package-data]
storyloom = ["web/static/**/*", "core/lang_meta/*.json", "models/*.onnx", "locale/**/*", "content/**/*", "assets/data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/prompt_lab"
# Tests must import the checked-out source tree, never an installed
# `storyloom` (a stale wheel / editable install in the environment would
# otherwise shadow src and run an outdated or incomplete codebase — e.g.
# the recent `_names` module missing). `pythonpath` is prepended to
# sys.path by pytest, so both local and CI runs are deterministic.
pythonpath = ["src"]
