[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "storyloom"
version = "2.1.0"
description = "AI-powered interactive text fiction game engine"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
bg = ["onnxruntime>=1.18", "numpy>=1.24", "pillow>=10.0"]
desktop = ["pywebview>=5.0"]

[project.scripts]
storyloom-web = "storyloom.web.server:main"

[tool.setuptools.package-data]
storyloom = ["web/static/**/*", "core/lang_meta/*.json", "models/*.onnx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/prompt_lab"
